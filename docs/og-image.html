<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>OG Image Generator — Closet AI</title>
  <style>
    body {
      margin: 0; padding: 32px;
      background: #111;
      display: flex; flex-direction: column;
      align-items: center; gap: 20px;
      font-family: 'Segoe UI', 'Yu Gothic', 'Meiryo', sans-serif;
    }
    .dl-btn {
      background: #8b5cf6; color: #fff; border: none;
      border-radius: 12px; padding: 14px 40px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: background 0.2s;
    }
    .dl-btn:hover { background: #7c3aed; }
    .dl-btn:disabled { opacity: 0.6; cursor: default; }
    .note { color: rgba(255,255,255,0.4); font-size: 13px; }
    canvas { border-radius: 4px; box-shadow: 0 8px 40px rgba(0,0,0,0.6); }
  </style>
</head>
<body>
  <button class="dl-btn" id="btn" onclick="downloadPng()">⬇ og.png としてダウンロード</button>
  <span class="note">ダウンロードした og.png を docs/ フォルダに入れてください</span>
  <canvas id="c" width="1200" height="630"></canvas>

  <script>
  (function() {
    const W = 1200, H = 630;
    const BRAND   = '#1a0a2e';
    const PURPLE  = '#8b5cf6';
    const PURPLE2 = '#a78bfa';
    const WHITE   = '#ffffff';

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      if (fill)   { ctx.fillStyle = fill;     ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
    }

    function draw() {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');

      // ── 背景グラデーション ──
      const bg = ctx.createLinearGradient(0, 0, W, H);
      bg.addColorStop(0,    '#1a0a2e');
      bg.addColorStop(0.55, '#2d1054');
      bg.addColorStop(1,    '#1e0a3c');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // ── グリッドパターン ──
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= W; x += 60) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
      }
      for (let y = 0; y <= H; y += 60) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }

      // ── 右側の光彩 ──
      const glow = ctx.createRadialGradient(900, 315, 0, 900, 315, 400);
      glow.addColorStop(0,   'rgba(139,92,246,0.22)');
      glow.addColorStop(1,   'rgba(139,92,246,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);

      // ──────────────────────────────
      // 左：テキストエリア
      // ──────────────────────────────
      const LX = 80;

      // バッジ
      roundRect(ctx, LX, 80, 260, 36, 18, 'rgba(139,92,246,0.25)');
      ctx.strokeStyle = 'rgba(139,92,246,0.5)';
      ctx.lineWidth = 1;
      roundRect(ctx, LX, 80, 260, 36, 18, null, 'rgba(139,92,246,0.5)');
      ctx.fillStyle = PURPLE2;
      ctx.font = '600 13px "Segoe UI","Yu Gothic","Meiryo",sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText('✦  AI FASHION ASSISTANT', LX + 20, 80 + 18);

      // タイトル "Closet "
      ctx.textBaseline = 'alphabetic';
      ctx.font = 'bold 96px "Segoe UI","Yu Gothic","Meiryo",sans-serif';
      ctx.fillStyle = WHITE;
      ctx.fillText('Closet ', LX, 240);
      // "AI" in purple
      ctx.fillStyle = PURPLE2;
      const closetW = ctx.measureText('Closet ').width;
      ctx.fillText('AI', LX + closetW, 240);

      // タグライン
      ctx.font = '300 26px "Segoe UI","Yu Gothic","Meiryo",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText('毎朝の「何着よう」を、', LX, 290);
      ctx.fillText('AIが解決する。', LX, 326);

      // フィーチャー行
      const features = [
        '📸  服を撮るだけ — AIが自動解析',
        '🌤️  天気×TPOでコーデを毎日提案',
        '🗂️  スマートなクローゼット管理',
      ];
      ctx.font = '500 19px "Segoe UI","Yu Gothic","Meiryo",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      features.forEach((f, i) => {
        const fy = 390 + i * 42;
        // ドット
        ctx.beginPath();
        ctx.arc(LX + 6, fy - 6, 5, 0, Math.PI * 2);
        ctx.fillStyle = PURPLE2;
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.fillText(f, LX + 22, fy);
      });

      // URL
      ctx.font = '400 14px "Segoe UI","Yu Gothic","Meiryo",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillText('closet-ai.app', LX, H - 30);

      // ──────────────────────────────
      // 右：スマホモック
      // ──────────────────────────────
      const PX = 760, PY = 60, PW = 210, PH = 450, PR = 36;

      // 影
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 48;
      ctx.shadowOffsetY = 24;
      roundRect(ctx, PX, PY, PW, PH, PR, '#0d0618');
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      // 枠
      ctx.lineWidth = 2;
      roundRect(ctx, PX, PY, PW, PH, PR, null, 'rgba(255,255,255,0.12)');

      // ノッチ
      ctx.fillStyle = '#0d0618';
      roundRect(ctx, PX + PW/2 - 35, PY + 10, 70, 18, 9, '#0d0618');

      // ── ステータスバー ──
      ctx.fillStyle = BRAND;
      roundRect(ctx, PX + 2, PY + 2, PW - 4, 68, PR - 2, BRAND);
      ctx.font = '400 7px "Segoe UI","Yu Gothic","Meiryo",sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('MY CLOSET', PX + 12, PY + 42);
      ctx.font = 'bold 13px "Segoe UI","Yu Gothic","Meiryo",sans-serif';
      ctx.fillStyle = WHITE;
      ctx.fillText('クローゼット', PX + 12, PY + 58);

      // ── タブ ──
      ctx.fillStyle = BRAND;
      ctx.fillRect(PX + 2, PY + 70, PW - 4, 22);

      const tabs = ['すべて', 'トップス', 'パンツ'];
      let tx = PX + 10;
      tabs.forEach((tab, i) => {
        const tw = ctx.measureText(tab).width + 14;
        if (i === 0) {
          roundRect(ctx, tx, PY + 72, tw, 16, 8, WHITE);
          ctx.font = 'bold 7px "Segoe UI","Yu Gothic","Meiryo",sans-serif';
          ctx.fillStyle = BRAND;
        } else {
          roundRect(ctx, tx, PY + 72, tw, 16, 8, null, 'rgba(255,255,255,0.2)');
          ctx.font = '400 7px "Segoe UI","Yu Gothic","Meiryo",sans-serif';
          ctx.fillStyle = 'rgba(255,255,255,0.5)';
        }
        ctx.textBaseline = 'middle';
        ctx.fillText(tab, tx + 7, PY + 80);
        tx += tw + 6;
      });

      // ── グリッド（4枚カード）──
      ctx.fillStyle = '#fafaf7';
      ctx.fillRect(PX + 2, PY + 92, PW - 4, PH - 120);

      const clothes = [
        { emoji: '👔', bg: '#f5f5f0', name: '白シャツ',   cat: 'トップス' },
        { emoji: '👖', bg: '#333',    name: '黒スキニー', cat: 'パンツ' },
        { emoji: '🧥', bg: '#c9b99a', name: 'コート',     cat: 'アウター' },
        { emoji: '👟', bg: '#efefef', name: 'スニーカー', cat: 'シューズ' },
      ];
      const COL = 2, CGAP = 6, CPX = PX + 8, CPY = PY + 98;
      const CW = (PW - 16 - CGAP * (COL - 1)) / COL;

      clothes.forEach((cl, i) => {
        const col = i % COL, row = Math.floor(i / COL);
        const cx = CPX + col * (CW + CGAP);
        const cy = CPY + row * (CW + 26 + CGAP);
        // カード
        roundRect(ctx, cx, cy, CW, CW + 26, 8, '#fff');
        ctx.strokeStyle = '#e8e8e0';
        ctx.lineWidth = 0.8;
        roundRect(ctx, cx, cy, CW, CW + 26, 8, null, '#e8e8e0');
        // 画像背景
        roundRect(ctx, cx + 3, cy + 3, CW - 6, CW - 6, 6, cl.bg);
        // 絵文字
        ctx.font = `${(CW - 14)}px serif`;
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'center';
        ctx.fillText(cl.emoji, cx + CW / 2, cy + CW / 2);
        // 名前
        ctx.font = 'bold 7px "Segoe UI","Yu Gothic","Meiryo",sans-serif';
        ctx.fillStyle = '#1a1a1a';
        ctx.textBaseline = 'alphabetic';
        ctx.textAlign = 'left';
        ctx.fillText(cl.name, cx + 4, cy + CW + 10);
        // バッジ
        roundRect(ctx, cx + 3, cy + CW + 14, CW - 6, 10, 4, '#f0ede8');
        ctx.font = '400 5px "Segoe UI","Yu Gothic","Meiryo",sans-serif';
        ctx.fillStyle = '#888';
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'center';
        ctx.fillText(cl.cat, cx + CW / 2, cy + CW + 19);
      });
      ctx.textAlign = 'left';

      // ── タブバー ──
      ctx.fillStyle = '#fafaf7';
      ctx.fillRect(PX + 2, PY + PH - 30, PW - 4, 28);
      ctx.strokeStyle = '#e8e8e0';
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(PX + 2, PY + PH - 30);
      ctx.lineTo(PX + PW - 2, PY + PH - 30);
      ctx.stroke();

      const barItems = [['🗂️', 'クローゼット', true], ['✨', 'コーデ提案', false], ['⚙️', '設定', false]];
      barItems.forEach(([icon, label, active], i) => {
        const bx = PX + 10 + i * ((PW - 20) / 3);
        const bc = PY + PH - 26;
        ctx.font = '11px serif';
        ctx.textBaseline = 'alphabetic';
        ctx.textAlign = 'center';
        ctx.fillText(icon, bx + (PW - 20) / 6, bc + 10);
        ctx.font = `${active ? 'bold' : '400'} 5px "Segoe UI","Yu Gothic","Meiryo",sans-serif`;
        ctx.fillStyle = active ? BRAND : '#999';
        ctx.fillText(label, bx + (PW - 20) / 6, bc + 22);
      });
      ctx.textAlign = 'left';

      // ── AI解析バッジ（右下）──
      const BX = PX + PW - 10, BY = PY + PH - 60;
      const BW = 150, BH = 90;
      roundRect(ctx, BX, BY, BW, BH, 14, '#ffffff');
      ctx.shadowColor = 'rgba(0,0,0,0.2)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 4;
      roundRect(ctx, BX, BY, BW, BH, 14, '#ffffff');
      ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

      ctx.font = '600 9px "Segoe UI","Yu Gothic","Meiryo",sans-serif';
      ctx.fillStyle = '#999';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('✦ AI ANALYSIS', BX + 12, BY + 18);

      const aiRows = [
        ['カテゴリ', 'トップス'],
        ['カラー', 'ネイビー'],
        ['季節', '秋・冬'],
      ];
      aiRows.forEach(([label, value], i) => {
        const ry = BY + 30 + i * 20;
        // ドット
        ctx.beginPath();
        ctx.arc(BX + 16, ry - 3, 4, 0, Math.PI * 2);
        ctx.fillStyle = PURPLE;
        ctx.fill();
        // ラベル
        ctx.font = '400 8px "Segoe UI","Yu Gothic","Meiryo",sans-serif';
        ctx.fillStyle = '#999';
        ctx.fillText(label + ':', BX + 26, ry);
        // 値
        ctx.font = 'bold 9px "Segoe UI","Yu Gothic","Meiryo",sans-serif';
        ctx.fillStyle = '#1a1a1a';
        ctx.fillText(value, BX + 26 + ctx.measureText(label + ': ').width + 10, ry);
      });
    }

    draw();

    window.downloadPng = function() {
      const btn = document.getElementById('btn');
      btn.textContent = '生成中...';
      btn.disabled = true;
      const canvas = document.getElementById('c');
      const link = document.createElement('a');
      link.download = 'og.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      setTimeout(() => {
        btn.textContent = '✓ ダウンロード完了！docs/ フォルダに入れてください';
        btn.disabled = false;
      }, 500);
    };
  })();
  </script>
</body>
</html>
