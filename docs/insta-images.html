<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Instagram 投稿用画像ジェネレーター — Closet AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d; color: #fff;
      font-family: 'Segoe UI', 'Meiryo', 'Yu Gothic', sans-serif;
      padding: 40px 32px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .sub { color: rgba(255,255,255,0.4); font-size: 13px; margin-bottom: 32px; }
    .topbar { display: flex; align-items: center; gap: 20px; margin-bottom: 36px; }
    .dl-all {
      background: #8b5cf6; color: #fff; border: none;
      border-radius: 12px; padding: 14px 36px;
      font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: background 0.2s;
    }
    .dl-all:hover { background: #7c3aed; }
    .note { color: rgba(255,255,255,0.35); font-size: 13px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      max-width: 1100px;
    }
    .slide-wrap { display: flex; flex-direction: column; gap: 10px; }
    .slide-label { font-size: 12px; color: rgba(255,255,255,0.45); letter-spacing: 0.5px; }
    canvas { width: 100%; aspect-ratio: 1; border-radius: 12px; display: block; }
    .dl-btn {
      background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.65);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; padding: 9px 0;
      font-size: 13px; cursor: pointer; font-family: inherit;
      transition: background 0.2s; text-align: center;
    }
    .dl-btn:hover { background: rgba(255,255,255,0.14); }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <h1>📸 Instagram 投稿用画像ジェネレーター</h1>
      <p class="sub">全6枚 · 1080×1080px · ファイルをダブルクリックで開いてください</p>
    </div>
    <button class="dl-all" onclick="downloadAll()">⬇ 全6枚まとめてダウンロード</button>
  </div>
  <div class="grid" id="grid"></div>

<script>
(function () {
  const W = 1080, H = 1080;
  const F = '"Segoe UI","Meiryo","Yu Gothic","MS PGothic",sans-serif';
  const C = {
    brand: '#1a0a2e', brandMid: '#2d1054', brandDark: '#0d0618',
    purple: '#8b5cf6', purpleLight: '#a78bfa',
    white: '#ffffff', light: '#fafaf7',
    text: '#1a1a1a', muted: '#666',
  };

  /* ── utils ── */
  function rr(ctx, x, y, w, h, r, fill, stroke, lw = 1.5) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x+w, y,   x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x,   y+h, r);
    ctx.arcTo(x,   y+h, x,   y,   r);
    ctx.arcTo(x,   y,   x+w, y,   r);
    ctx.closePath();
    if (fill)   { ctx.fillStyle = fill;       ctx.fill(); }
    if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
  }

  function lg(ctx, x1, y1, x2, y2, stops) {
    const g = ctx.createLinearGradient(x1, y1, x2, y2);
    stops.forEach(([p, c]) => g.addColorStop(p, c));
    return g;
  }

  function rg(ctx, cx, cy, r0, r1, stops) {
    const g = ctx.createRadialGradient(cx, cy, r0, cx, cy, r1);
    stops.forEach(([p, c]) => g.addColorStop(p, c));
    return g;
  }

  function txt(ctx, s, x, y, font, color, align = 'left', base = 'alphabetic') {
    ctx.font = font; ctx.fillStyle = color;
    ctx.textAlign = align; ctx.textBaseline = base;
    ctx.fillText(s, x, y);
  }

  function gridLines(ctx, step = 80, color = 'rgba(255,255,255,0.035)') {
    ctx.strokeStyle = color; ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += step) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y <= H; y += step) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  }

  function footer(ctx, n, dark = false) {
    const alpha = dark ? '0.25' : '0.85';
    const ac    = dark ? C.purple : C.purpleLight;
    ctx.font = `700 28px ${F}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = `rgba(${dark?'26,10,46':'255,255,255'},${alpha})`;
    ctx.fillText('Closet ', 60, H - 44);
    const cw = ctx.measureText('Closet ').width;
    ctx.fillStyle = ac; ctx.fillText('AI', 60 + cw, H - 44);
    ctx.font = `400 24px ${F}`; ctx.textAlign = 'right';
    ctx.fillStyle = dark ? 'rgba(0,0,0,0.22)' : 'rgba(255,255,255,0.25)';
    ctx.fillText(`${n} / 6`, W - 60, H - 44);
  }

  /* ── SLIDE 1: Cover ── */
  function s1(ctx) {
    ctx.fillStyle = lg(ctx,0,0,W,H,[[0,C.brand],[.55,C.brandMid],[1,'#1e0a3c']]);
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = rg(ctx,W/2,H/2,0,560,[[0,'rgba(139,92,246,.28)'],[1,'rgba(139,92,246,0)']]);
    ctx.fillRect(0,0,W,H);
    gridLines(ctx);

    /* badge */
    rr(ctx,W/2-200,110,400,58,29,'rgba(139,92,246,.2)','rgba(139,92,246,.5)');
    txt(ctx,'✦  AI FASHION ASSISTANT',W/2,139,`600 24px ${F}`,C.purpleLight,'center','middle');

    /* big title */
    ctx.save();
    ctx.font = `900 148px ${F}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.white; ctx.fillText('Closet', W/2, 380);
    ctx.fillStyle = C.purpleLight; ctx.fillText('AI', W/2, 518);
    ctx.restore();

    /* tagline */
    txt(ctx,'毎朝の「何着よう」を、',W/2,600,`300 40px ${F}`,'rgba(255,255,255,.62)','center');
    txt(ctx,'AIが解決する。',W/2,652,`300 40px ${F}`,'rgba(255,255,255,.62)','center');

    /* emoji row */
    ['👗','👔','🧥','👖','👟','👜'].forEach((e,i)=>{
      ctx.globalAlpha = 0.72;
      ctx.font = `64px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(e, 120 + i * 169, 770);
    });
    ctx.globalAlpha = 1;
    footer(ctx,1);
  }

  /* ── SLIDE 2: Problem ── */
  function s2(ctx) {
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
    /* top dark band */
    ctx.fillStyle = lg(ctx,0,0,0,260,[[0,C.brand],[1,'rgba(26,10,46,0)']]);
    ctx.fillRect(0,0,W,260);

    /* emoji */
    ctx.font=`120px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('😩',W/2,140);

    /* headline */
    txt(ctx,'こんな朝、',W/2,308,`700 72px ${F}`,C.text,'center');
    txt(ctx,'ありませんか？',W/2,394,`700 72px ${F}`,C.text,'center');

    /* pain cards */
    const pains=[
      {e:'😰',t:'毎朝コーデに時間がかかる'},
      {e:'🤷',t:'持ってる服を把握できていない'},
      {e:'🌧️',t:'天気に合わない服を着て後悔'},
      {e:'🔁',t:'いつも同じ服ばかり着ている'},
    ];
    pains.forEach((p,i)=>{
      const py = 440 + i*112;
      rr(ctx,72,py,W-144,90,18,'#fff','#e8e8e0');
      rr(ctx,72,py,7,90,3.5,C.purple); /* left accent */
      ctx.font=`48px serif`; ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText(p.e, 110, py+45);
      txt(ctx,p.t,174,py+45,`500 36px ${F}`,C.text,'left','middle');
    });
    footer(ctx,2,true);
  }

  /* ── SLIDE 3: AI Analysis ── */
  function s3(ctx) {
    ctx.fillStyle = lg(ctx,0,0,W,H,[[0,C.brandDark],[1,C.brand]]);
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = rg(ctx,200,320,0,420,[[0,'rgba(139,92,246,.15)'],[1,'rgba(139,92,246,0)']]);
    ctx.fillRect(0,0,W,H);

    rr(ctx,60,68,220,54,27,'rgba(139,92,246,.2)','rgba(139,92,246,.5)');
    txt(ctx,'📸  FEATURE 1',170,95,`600 23px ${F}`,C.purpleLight,'center','middle');

    txt(ctx,'写真1枚で、',60,196,`700 78px ${F}`,C.white);
    txt(ctx,'AIが全部解析',60,288,`700 78px ${F}`,C.purpleLight);
    txt(ctx,'名前・カテゴリ・色・季節を自動判定。',60,348,`300 32px ${F}`,'rgba(255,255,255,.52)');
    txt(ctx,'入力は一切不要。',60,390,`300 32px ${F}`,'rgba(255,255,255,.52)');

    /* result card */
    const CX=60,CY=430,CW=W-120,CH=442;
    rr(ctx,CX,CY,CW,CH,24,'rgba(255,255,255,.06)','rgba(255,255,255,.1)');
    txt(ctx,'AI ANALYSIS RESULT',CX+36,CY+46,`600 23px ${F}`,'rgba(255,255,255,.32)');

    const rows=[
      {ic:'📝',lb:'アイテム名',vl:'ネイビーニット',bd:'3候補から選択'},
      {ic:'🏷️',lb:'カテゴリ',   vl:'トップス',     bd:'AI自動判定'},
      {ic:'🎨',lb:'カラー',     vl:'ネイビー',     bd:'AI自動判定'},
      {ic:'🍂',lb:'シーズン',   vl:'秋・冬',       bd:'AI自動判定'},
    ];
    rows.forEach((r,i)=>{
      const ry=CY+78+i*86;
      if(i>0){ctx.beginPath();ctx.moveTo(CX+36,ry-14);ctx.lineTo(CX+CW-36,ry-14);ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;ctx.stroke();}
      ctx.font=`38px serif`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(r.ic,CX+36,ry+24);
      txt(ctx,r.lb,CX+92,ry+10,`400 22px ${F}`,'rgba(255,255,255,.38)');
      txt(ctx,r.vl,CX+92,ry+42,`700 30px ${F}`,C.white);
      ctx.font=`500 20px ${F}`;
      const bw=ctx.measureText(r.bd).width+26;
      const bx=CX+CW-36-bw;
      rr(ctx,bx,ry+10,bw,34,17,'rgba(139,92,246,.3)','rgba(139,92,246,.5)');
      txt(ctx,r.bd,bx+bw/2,ry+27,`500 19px ${F}`,C.purpleLight,'center','middle');
    });

    txt(ctx,'✦ Powered by Claude AI',W/2,H-44,`500 23px ${F}`,'rgba(255,255,255,.18)','center');
  }

  /* ── SLIDE 4: Outfit Suggest ── */
  function s4(ctx) {
    ctx.fillStyle = lg(ctx,0,0,W,H,[[0,C.brand],[.6,C.brandMid],[1,'#1e0a3c']]);
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = rg(ctx,W*.72,H*.3,0,500,[[0,'rgba(139,92,246,.2)'],[1,'rgba(139,92,246,0)']]);
    ctx.fillRect(0,0,W,H);

    /* weather badge */
    rr(ctx,60,68,370,64,32,'rgba(255,255,255,.08)','rgba(255,255,255,.15)');
    ctx.font=`40px serif`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('🌤️',90,100);
    txt(ctx,'今日  18°C  ／  快晴',150,100,`500 30px ${F}`,'rgba(255,255,255,.72)','left','middle');

    /* headline */
    txt(ctx,'天気に合わせて、',60,215,`700 70px ${F}`,C.white);
    txt(ctx,'AIがコーデを提案',60,298,`700 70px ${F}`,C.purpleLight);

    /* coord card */
    const CX=60,CY=365,CW=W-120,CH=500;
    rr(ctx,CX,CY,CW,CH,28,'#fff');

    /* tpo badge */
    rr(ctx,CX+28,CY+28,116,42,21,'#f0ede8');
    txt(ctx,'仕事',CX+86,CY+49,`600 24px ${F}`,'#666','center','middle');
    /* score */
    rr(ctx,CX+CW-108,CY+20,84,84,42,'#f0ede8');
    txt(ctx,'94',CX+CW-66,CY+62,`700 36px ${F}`,C.brand,'center','middle');
    txt(ctx,'score',CX+CW-66,CY+80,`400 17px ${F}`,'#aaa','center','middle');
    /* weather */
    txt(ctx,'🌤️ 18°C  快晴',CX+28,CY+86,`400 24px ${F}`,'#bbb');

    /* clothes */
    const items=[
      {e:'👔',bg:'#f5f5f0',n:'白シャツ'},
      {e:'👖',bg:'#2a2a2a',n:'黒スキニー'},
      {e:'🧥',bg:'#c9b99a',n:'コート'},
      {e:'👟',bg:'#efefef',n:'スニーカー'},
    ];
    const IW=(CW-56-12*3)/4;
    items.forEach((it,i)=>{
      const ix=CX+28+i*(IW+12), iy=CY+116;
      rr(ctx,ix,iy,IW,IW*1.25,14,it.bg);
      ctx.font=`${IW*.48}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(it.e,ix+IW/2,iy+IW*.52);
      txt(ctx,it.n,ix+IW/2,iy+IW*1.14,`500 19px ${F}`,'#555','center','middle');
    });

    /* comment */
    rr(ctx,CX+28,CY+382,CW-56,100,16,'#f8f7f5');
    txt(ctx,'✦ AIからのコメント',CX+48,CY+406,`600 21px ${F}`,'#bbb');
    txt(ctx,'コートで温度調節も完璧。知的な仕事コーデです。',CX+48,CY+444,`500 27px ${F}`,C.text);

    footer(ctx,4);
  }

  /* ── SLIDE 5: Closet ── */
  function s5(ctx) {
    ctx.fillStyle = C.light; ctx.fillRect(0,0,W,H);

    /* header */
    ctx.fillStyle = C.brand; ctx.fillRect(0,0,W,212);
    txt(ctx,'MY CLOSET',60,100,`600 25px ${F}`,'rgba(255,255,255,.38)');
    txt(ctx,'クローゼット',60,162,`700 60px ${F}`,C.white);
    /* add btn */
    rr(ctx,W-126,84,80,80,40,C.purple);
    txt(ctx,'+',W-86,124,`300 50px ${F}`,C.white,'center','middle');

    /* tabs */
    const tabs=['すべて','トップス','パンツ','シューズ'];
    let tx=60;
    tabs.forEach((t,i)=>{
      ctx.font=`500 26px ${F}`;
      const tw=ctx.measureText(t).width+38;
      rr(ctx,tx,220,tw,56,28,i===0?C.brand:'#fff',i===0?null:'#e0e0d8');
      txt(ctx,t,tx+tw/2,248,`500 26px ${F}`,i===0?'#fff':'#666','center','middle');
      tx+=tw+14;
    });

    /* grid */
    const clothes=[
      {e:'👔',bg:'#f5f5f0',n:'白シャツ',   c:'トップス'},
      {e:'👖',bg:'#2a2a2a',n:'黒スキニー', c:'パンツ'},
      {e:'🧥',bg:'#c9b99a',n:'コート',     c:'アウター'},
      {e:'🧶',bg:'#1b2a4a',n:'ニット',     c:'トップス'},
      {e:'👗',bg:'#8b6b6b',n:'スカート',   c:'スカート'},
      {e:'👟',bg:'#efefef',n:'スニーカー', c:'シューズ'},
    ];
    const COLS=3, GAP=20, PX=44;
    const CW2=(W-PX*2-GAP*(COLS-1))/COLS, CH2=CW2+82;
    clothes.forEach((cl,i)=>{
      const col=i%COLS, row=Math.floor(i/COLS);
      const cx=PX+col*(CW2+GAP), cy=300+row*(CH2+GAP);
      rr(ctx,cx,cy,CW2,CH2,20,'#fff','#e8e8e0');
      rr(ctx,cx+10,cy+10,CW2-20,CW2-20,14,cl.bg);
      ctx.font=`${(CW2-40)*.52}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(cl.e,cx+CW2/2,cy+10+(CW2-20)/2);
      txt(ctx,cl.n,cx+CW2/2,cy+CW2+26,`600 23px ${F}`,C.text,'center');
      ctx.font=`400 18px ${F}`;
      const bw2=ctx.measureText(cl.c).width+22;
      rr(ctx,cx+CW2/2-bw2/2,cy+CW2+38,bw2,30,15,'#f0ede8');
      txt(ctx,cl.c,cx+CW2/2,cy+CW2+53,`400 17px ${F}`,'#888','center','middle');
    });
    footer(ctx,5,true);
  }

  /* ── SLIDE 6: CTA ── */
  function s6(ctx) {
    ctx.fillStyle = lg(ctx,0,0,W,H,[[0,C.brand],[.5,'#3b1578'],[1,C.brand]]);
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = rg(ctx,W/2,H/2,0,620,[[0,'rgba(139,92,246,.26)'],[1,'rgba(139,92,246,0)']]);
    ctx.fillRect(0,0,W,H);
    gridLines(ctx);

    ctx.font=`148px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🎉',W/2,220);

    txt(ctx,'リリース前',W/2,376,`700 84px ${F}`,C.white,'center');
    txt(ctx,'事前登録受付中',W/2,476,`700 84px ${F}`,C.purpleLight,'center');

    ['📸  写真1枚でAI自動解析','🌤️  天気連動コーデ提案','🗂️  スマートなクローゼット管理'].forEach((it,i)=>{
      txt(ctx,it,W/2,578+i*70,`400 33px ${F}`,'rgba(255,255,255,.58)','center');
    });

    /* CTA btn */
    rr(ctx,W/2-310,808,620,84,42,C.purple);
    txt(ctx,'プロフィールのリンクから登録 →',W/2,850,`700 31px ${F}`,C.white,'center','middle');

    txt(ctx,'closet-ai.app',W/2,944,`400 28px ${F}`,'rgba(255,255,255,.28)','center');
    footer(ctx,6);
  }

  /* ── render ── */
  const SLIDES = [
    { fn: s1, label: 'スライド 1 — カバー' },
    { fn: s2, label: 'スライド 2 — 悩みの共感' },
    { fn: s3, label: 'スライド 3 — AI解析機能' },
    { fn: s4, label: 'スライド 4 — コーデ提案' },
    { fn: s5, label: 'スライド 5 — クローゼット' },
    { fn: s6, label: 'スライド 6 — 事前登録CTA' },
  ];

  const grid = document.getElementById('grid');
  const canvases = [];

  SLIDES.forEach((s, i) => {
    const wrap  = document.createElement('div'); wrap.className  = 'slide-wrap';
    const label = document.createElement('div'); label.className = 'slide-label'; label.textContent = s.label;
    const cv    = document.createElement('canvas'); cv.width = W; cv.height = H;
    const btn   = document.createElement('button'); btn.className = 'dl-btn';
    btn.textContent = `⬇ slide-0${i+1}.png`;
    btn.onclick = () => dl(cv, i+1);
    wrap.append(label, cv, btn);
    grid.appendChild(wrap);
    canvases.push(cv);
    s.fn(cv.getContext('2d'));
  });

  function dl(cv, n) {
    const a = document.createElement('a');
    a.download = `closet-ai-slide-0${n}.png`;
    a.href = cv.toDataURL('image/png');
    a.click();
  }

  window.downloadAll = () => canvases.forEach((cv, i) => setTimeout(() => dl(cv, i+1), i * 400));
})();
</script>
</body>
</html>
