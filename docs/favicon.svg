<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d1054"/>
      <stop offset="1" stop-color="#1a0a2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Hook (circle) -->
  <circle cx="32" cy="17" r="4.5" fill="none" stroke="#a78bfa" stroke-width="2.8"/>
  <!-- Stem -->
  <line x1="32" y1="21.5" x2="32" y2="29" stroke="#a78bfa" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Hanger curve -->
  <path d="M13 47 Q16 31 32 28 Q48 31 51 47"
        fill="none" stroke="white" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom bar -->
  <line x1="11" y1="47" x2="53" y2="47"
        stroke="white" stroke-width="3.2" stroke-linecap="round"/>
</svg>
